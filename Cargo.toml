[package]
name = "sinktools"
version = "0.2.0-alpha.2"
description = "Extra sink adaptors and helpers."
documentation = "https://docs.rs/sinktools/"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hydro-project/sinktools"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "variadics"]
std = ["futures-util/std", "variadics?/std"]
variadics = ["dep:variadics"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
] }
pin-project-lite = "0.2"
sealed = "0.6"
variadics = { optional = true, default-features = false, version = "^0.2.0-alpha.1" }

[dev-dependencies]
bytes = "1.1.0"
futures-task = { version = "0.3" }
sinktools = { path = ".", features = ["std"] }
tokio = { version = "1.29.0", default-features = false, features = ["macros", "rt"] }
tokio-stream = { version = "0.1.3", default-features = false }
tokio-util = { version = "0.7.5", default-features = false, features = ["net", "codec"] }

[lints.rust]
impl_trait_overcaptures = "warn"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_qualifications = "warn"

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
explicit_into_iter_loop = "warn"
let_and_return = "allow"
manual_is_variant_and = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
try_err = "warn"
uninlined_format_args = "allow"
unused_async = "warn"
